<!DOCTYPE html>
<html>
<head>
  <title>Darmon.uz</title>
</head>
<body>

<h1>Darmon.uz</h1>

<h2>Klinika: Namuna Klinika</h2>

<h3>Shifokor: Dr. Aliyev</h3>

<p>Navbat raqami: <span id="queue">0</span></p>

<button onclick="takeQueue()">Navbat olish</button>

<script type="module">
  // Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // Firebase config (SENIKI)
  const firebaseConfig = {
    apiKey: "AIzaSyDwWpQl4ImkT_ig0nHVa7xWpF5ixwgBw7s",
    authDomain: "darmon103.firebaseapp.com",
    projectId: "darmon103",
    storageBucket: "darmon103.appspot.com",
    messagingSenderId: "151196294903",
    appId: "1:151196294903:web:5b793bda67377897647df2",
    measurementId: "G-HJ6S8NHZX1"
  };

  // init
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const countRef = ref(db, "queue/count");

  // live update
  onValue(countRef, (snap) => {
    document.getElementById("queue").innerText = snap.val() || 0;
  });

  // button
  window.takeQueue = function () {
    runTransaction(countRef, (current) => {
      return (current || 0) + 1;
    });
  };

</script>

</body>
</html>
