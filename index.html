<!DOCTYPE html>
<html>
<head>
    <title>Darmon.uz</title>
</head>
<body>

<h1>Darmon.uz</h1>

<h2>Klinika: Namuna Klinika</h2>

<h3>Shifokor: Dr. Aliyev</h3>

<p>Navbat raqami: <span id="queue">0</span></p>

<button onclick="takeQueue()">Navbat olish</button>

<script>
let count = localStorage.getItem("queue") || 0;
count = Number(count);

function takeQueue() {
    count++;
    localStorage.setItem("queue", count);
    document.getElementById("queue").innerText = count;
}
</script>

</body>
</html>
