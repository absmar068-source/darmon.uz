<!DOCTYPE html>

<!-- APP -->

  <!-- CLINICS -->

    <h2>Klinikalar</h2>

  </section>

  <!-- DOCTORS -->
  <section>
    <h2>Shifokorlar</h2>
    <div id="doctors"></div>
  </section>

  <!-- PROFILE -->
  <section>
    <h2>Profil</h2>
    <div id="profile"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
